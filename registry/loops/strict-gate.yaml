manifest: qf.loop/v1

# =============================================================================
# strict-gate — agent-gate, який МАЄ не пропустити.
#
# Дзеркало price-watch. Той демонструє гейт, що пропускає; цей — гейт, що
# зупиняє. Обидва потрібні: перевірка, яку ніколи не бачили провальною, — це
# перевірка, про яку ніхто не знає, чи вона працює.
#
# `escalateOn` тут НЕ `objection`: провалений гейт валить ран, а не віддає його
# людині. Так виглядає гейт, який є остаточним рішенням.
# =============================================================================

id: strict-gate
name: "Strict gate: a check that is allowed to say no"
version: 1.0.0
description: >
  Runs a machine check that ends the run when it fails, instead of handing the
  decision to a person. The shape to use when the answer is not negotiable.
owner: oleg
enabled: true

triggers:
  - kind: manual

settings:
  model: "anthropic/claude-3-haiku"
  budgetUsd: 0.10

steps:
  - id: sg-fetch
    kind: fetch
    config:
      name: "Read rate"
      url: "{{env.QLOOP_SOURCE_URL}}"
      format: json
      timeoutSec: "20"

  - id: sg-check
    kind: approval-gate
    config:
      name: "Above the line?"
      reviewer: agent
      rubric: >
        The payload holds `json.rates.UAH`. PASS only if it is above 42.0.
        Otherwise FAIL.
      # Не objection: провал гейта — кінець рану, не питання до людини.
      escalateOn: none

  - id: sg-send
    kind: api-request
    config:
      name: "Send the alert"
      method: POST
      url: "{{env.QLOOP_WEBHOOK_URL}}"
      expect: "2xx"
      timeoutSec: "20"
      body: '{"rate":"{{steps.Read rate.output.json.rates.UAH}}"}'
