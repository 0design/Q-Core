manifest: qf.loop/v1

# =============================================================================
# content-feed — the morning digest, as a loop that actually lives.
#
# schedule → fetch (a real feed) → llm-call (the digest) → api-request (a real
# receiver). No human gate, on purpose: this loop finishes by sending, and a
# person never has to be in the way of it.
#
# THE RECEIVER. Telegram, addressed through the environment:
# TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID. The token is NOT in this file and
# must never be — a manifest is a file that goes into git, and "share the loop"
# cannot mean "share the bot".
#
# With those two variables unset, `qf run` does not fire the request at a URL
# with braces still in it. It writes the digest to `.qf/out/<runId>.txt` and says
# so loudly, on stdout and in `.qf/last-run.json`. That is a degraded delivery,
# not a success — which is exactly how it reads in the output.
#
# WHAT THIS LOOP DOES NOT DO: remember. There is no cursor and no "last seen"
# anywhere in the engine, so it sends whatever the feed holds now. De-duplication
# belongs to the receiver, by link. Pretending the loop remembers would be worse
# than saying plainly that it does not.
# =============================================================================

id: content-feed
name: "Content feed: the morning digest"
version: 1.0.0
description: >
  Reads a feed every morning, writes a short digest, and sends it.
  No human gate. De-duplication happens at the receiver.
owner: oleg
enabled: true

triggers:
  # UTC. `qf run` performs ONE pass — this line documents the intended cadence;
  # what actually fires it is launchd. See README §Scheduling.
  #
  # 06:30 UTC = 09:30 Kyiv in summer, 08:30 in winter. The launchd job is set in
  # LOCAL time and so tracks the clock change; this line does not. When the two
  # disagree, the plist is the one that actually runs — see the plist header.
  - kind: schedule
    cron: "30 6 * * *"
  - kind: manual

settings:
  # Cheap on purpose: the work here is compression, not reasoning.
  model: "anthropic/claude-3-haiku"

  # The ceiling is FORCED and cuts BEFORE the model call, not after it. Two steps
  # on a cheap model fit with room to spare; it is written out so that the limit
  # is visible in the run rather than inherited from a default.
  budgetUsd: 0.10

steps:
  - id: cf-fetch
    kind: fetch
    config:
      name: "Fetch feed"
      # Hacker News' own front-page feed. Swap the URL for your own source — this
      # step is ordinary HTTP, so anything serving RSS or Atom works.
      #
      # Deliberately NOT hnrss.org, which is the obvious choice: it answered 200
      # and then 502 within the same hour while this loop was being built, and a
      # 09:30 job has nobody watching it. `limit` trims the feed to 8 regardless
      # of how many items the source returns.
      url: "{{env.QLOOP_SOURCE_URL}}"
      format: rss
      limit: "8"
      timeoutSec: "30"

  - id: cf-digest
    kind: llm-call
    config:
      name: "Write digest"
      role: editor
      maxTokens: "700"
      instructions: |
        You are given a JSON bundle whose `entries` array holds feed items, each
        with a title, a link and a summary.

        Write a short morning digest in plain text:
          • one opening line saying how many items there are;
          • then one line per item worth reading — "— <title> · <link>";
          • skip anything that is pure noise, and say how many you skipped.

        No markdown, no preamble, no sign-off. Keep it under 3000 characters:
        that is the limit of a single Telegram message.

        Do NOT add a signature line — one is appended after you, with the real
        cost of this run.

  # Telegram's sendMessage. `chat_id` and `text` are what it needs; `text` is the
  # digest from the step above, addressed BY STEP NAME. If the resolver ever
  # breaks, literal braces arrive in the message — visible, not silent.
  - id: cf-send
    kind: api-request
    config:
      name: "Send to Telegram"
      method: POST
      url: "https://api.telegram.org/bot{{env.TELEGRAM_BOT_TOKEN}}/sendMessage"
      expect: "2xx"
      timeoutSec: "30"
      # The signature is not decoration and not a static string somebody typed
      # once: {{run.costUsd}} is what THIS run has spent by the time the message
      # is sent. An outgoing request costs nothing, so it is the whole bill.
      body: '{"chat_id":"{{env.TELEGRAM_CHAT_ID}}","text":"{{steps.Write digest.output.text}}\n\n— generated by qloop for ${{run.costUsd}}","disable_web_page_preview":true}'
