manifest: q-core.workflow/v1

# Find relevant brand mentions without reading every source item manually.
# OpenRouter example: configure the model explicitly. CLI acceptance uses the caller interface.

id: brand-mentions
name: "Brand mentions: who talked about you today"
version: 1.2.0
description: >
  Searches a news feed for the brand you name and keeps only the real mentions.
  Reports zero when there are none, instead of padding. You approve the exact
  report before it is sent.
owner: oleg
enabled: true

# A required input has no default: a scheduled run without it would fail every day.
triggers:
  - kind: manual

inputs:
  brand:
    type: string
    required: true
    description: "Your brand: the exact name to look for in the feed"

settings:
  model: openai/gpt-4o-mini
  budgetUsd: 0.10

steps:
  - id: bm-fetch
    kind: fetch
    config:
      name: "Search the feed"
      url: "{{env.QCORE_SOURCE_URL}}"
      format: rss
      limit: "10"
      timeoutSec: "30"

  - id: bm-filter
    kind: llm-call
    config:
      name: "Keep the real ones"
      role: analyst
      maxTokens: "800"
      instructions: |
        The brand is: {{inputs.brand}}

        The `entries` array holds search results. Some genuinely discuss this
        brand; others merely contain the words.

        Keep only the real mentions. For each, write one line:
          "<publication> · <one sentence on what they said> · <link>"

        Then a final line: "TONE: positive / neutral / negative / mixed".

        If none of the results are real mentions, reply with exactly:
        "No mentions today." and nothing else — an empty morning is a result,
        not a failure, and padding it would train the reader to skim.

  - id: bm-approve
    kind: approval-gate
    config:
      name: "Send this report?"
      reviewer: human
      bind: sha256
      anchor: "Approve the exact mentions report that goes to your webhook"

  - id: bm-send
    kind: api-request
    config:
      name: "Send the summary"
      method: POST
      url: "{{env.QCORE_WEBHOOK_URL}}"
      expect: "2xx"
      timeoutSec: "30"
      body: '{"text":"{{steps.Send this report?.output.subject.text}}"}'
