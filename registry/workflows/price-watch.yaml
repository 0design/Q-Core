manifest: q-core.workflow/v1

# Surface relevant price updates without repeatedly checking the source manually.
# OpenRouter example: configure the model explicitly. CLI acceptance uses the caller interface.

id: price-watch
name: "Price watch: machine filters, human authorises"
version: 1.2.0
description: >
  Checks a rate. On an ordinary day the machine check stops the run quietly and
  nobody is asked. Only when USD/UAH is above the threshold does it hold for a
  human, and the alert goes out after that person approves it.
owner: oleg
enabled: true

triggers:
  - kind: schedule
    cron: "0 8 * * *"
  - kind: manual

settings:
  model: openai/gpt-4o-mini
  budgetUsd: 0.10

steps:
  - id: pw-fetch
    kind: fetch
    config:
      name: "Fetch rate"
      url: "https://open.er-api.com/v6/latest/USD"
      format: json
      timeoutSec: "30"

  - id: pw-judge
    kind: approval-gate
    config:
      name: "Worth waking anyone?"
      reviewer: agent
      anchor: "rate"
      rubric: >
        The payload holds `json.rates`, a map of currency code to rate against
        USD. PASS only if `json.rates.UAH` is above 42.0.
        Otherwise FAIL — an ordinary day is not news.
        The reason must state the USD/UAH rate and the 42.0 threshold, for
        example "USD/UAH is 42.35, above the 42.0 threshold".
      # none: a failed check ends the run here instead of asking a person.
      escalateOn: none

  - id: pw-confirm
    kind: approval-gate
    config:
      name: "Send it?"
      reviewer: human
      bind: sha256
      anchor: "Approve the exact alert: the rate and the threshold it crossed"

  - id: pw-send
    kind: api-request
    config:
      name: "Send the alert"
      method: POST
      url: "{{env.QCORE_WEBHOOK_URL}}"
      expect: "2xx"
      timeoutSec: "30"
      body: '{"text":"Rate alert — {{steps.Send it?.output.subject.verdict.reason}}"}'
