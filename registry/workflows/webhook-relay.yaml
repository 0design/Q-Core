manifest: q-core.workflow/v1

# Move source data to a configured receiver without a manual copy-and-paste step.
# No model inference is required.

id: webhook-relay
name: "Webhook relay: move data, call nothing"
version: 1.2.0
description: >
  Reads a JSON endpoint, shows you the exact data, and forwards it to a webhook
  as JSON only after you approve it. No model call is needed. Source and
  destination services may require credentials or charge for requests.
owner: oleg
enabled: true

triggers:
  - kind: manual

settings:
  budgetUsd: 0.05

steps:
  - id: wr-fetch
    kind: fetch
    config:
      name: "Read source"
      url: "{{env.QCORE_SOURCE_URL}}"
      format: json
      timeoutSec: "20"

  - id: wr-approve
    kind: approval-gate
    config:
      name: "Forward this data?"
      reviewer: human
      bind: sha256
      anchor: "Approve the exact JSON that goes to your webhook"

  # No body: Core sends the approved output as JSON in its envelope {runId, templateId, payload}.
  - id: wr-send
    kind: api-request
    config:
      name: "Forward it"
      method: POST
      url: "{{env.QCORE_WEBHOOK_URL}}"
      expect: "2xx"
      timeoutSec: "20"
