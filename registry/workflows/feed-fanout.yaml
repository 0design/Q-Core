manifest: q-core.workflow/v1

# Process multiple feed items consistently and collect the results without repeating the same manual steps.
# OpenRouter example: configure the model explicitly. CLI acceptance uses the caller interface.

id: feed-fanout
name: "Feed fan-out — a lane per entry"
version: 1.2.0
description: >
  Reads a feed and handles each entry separately: its own model call, your
  approval of that one sentence, then its own outgoing message. Truncation is
  reported, never silent.
owner: oleg
enabled: true

triggers:
  - kind: manual

settings:
  model: openai/gpt-4o-mini
  budgetUsd: 0.15

steps:
  - id: ff-fetch
    kind: fetch
    config:
      name: "Fetch feed"
      url: "{{env.QCORE_SOURCE_URL}}"
      format: rss
      limit: "20"
      timeoutSec: "30"

  - id: ff-lane
    kind: fan-out
    config:
      name: "Per entry"
      over: "{{steps.Fetch feed.output.entries}}"
      maxItems: "5"
    then:
      - id: ff-take
        kind: llm-call
        config:
          name: "Take on this one"
          maxTokens: "200"
          instructions: |
            One item from a feed:
              title: {{item.title}}
              link:  {{item.link}}

            Write ONE sentence: what it is, and who would care. No preamble.

      - id: ff-approve
        kind: approval-gate
        config:
          name: "Send this one?"
          reviewer: human
          bind: sha256
          anchor: "Approve the exact sentence sent for this feed item, with its title and link"

      - id: ff-send
        kind: api-request
        config:
          name: "Send this one"
          method: POST
          url: "{{env.QCORE_WEBHOOK_URL}}"
          expect: "2xx"
          timeoutSec: "30"
          body: '{"i":"{{index}}","title":"{{item.title}}","link":"{{item.link}}","take":"{{steps.Send this one?.output.subject.text}}"}'
