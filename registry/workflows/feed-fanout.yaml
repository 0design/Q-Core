manifest: q-core.workflow/v1

# Process multiple feed items consistently and collect the results without repeating the same manual steps.
# OpenRouter example: configure the model explicitly. CLI acceptance uses the caller interface.

id: feed-fanout
name: "Feed fan-out — a lane per entry"
version: 1.2.0
description: >
  Reads a feed and writes one sentence for each of the first five entries. You
  approve the exact list (title, link and sentence of every entry), then each
  entry goes out as its own message. Skipped entries are counted, never silent.
owner: oleg
enabled: true

triggers:
  - kind: manual

settings:
  model: openai/gpt-4o-mini
  budgetUsd: 0.15

steps:
  - id: ff-fetch
    kind: fetch
    config:
      name: "Fetch feed"
      url: "{{env.QCORE_SOURCE_URL}}"
      format: rss
      limit: "20"
      timeoutSec: "30"

  - id: ff-takes
    kind: llm-call
    config:
      name: "Take on each one"
      format: json
      maxTokens: "900"
      instructions: |
        The `entries` array holds feed items, each with a title and a link.
        Take the first five entries (fewer if there are fewer). For each, write
        ONE sentence: what it is, and who would care. No preamble.

        Return STRICTLY this JSON and nothing else — no fences, no prose:
        { "items": [ { "title": "<exact title>", "link": "<exact link>", "take": "<the sentence>" }, … ],
          "skipped": <integer: entries you were given beyond the first five> }

  - id: ff-approve
    kind: approval-gate
    config:
      name: "Send these?"
      reviewer: human
      bind: sha256
      anchor: "Approve the exact list: the title, link and sentence of every entry, each sent as its own message"

  - id: ff-lane
    kind: fan-out
    config:
      name: "Per entry"
      over: "{{steps.Send these?.output.subject.items}}"
      maxItems: "5"
    then:
      - id: ff-send
        kind: api-request
        config:
          name: "Send this one"
          method: POST
          url: "{{env.QCORE_WEBHOOK_URL}}"
          expect: "2xx"
          timeoutSec: "30"
          body: '{"i":"{{index}}","title":"{{item.title}}","link":"{{item.link}}","take":"{{item.take}}"}'
