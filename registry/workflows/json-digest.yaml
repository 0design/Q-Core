manifest: q-core.workflow/v1

# Produce a structured summary that a downstream service can consume without manual reformatting.
# OpenRouter example: configure the model explicitly. CLI acceptance uses the caller interface.

id: json-digest
name: "JSON digest: structured output or nothing"
version: 1.2.0
description: >
  Asks the model for strict JSON and refuses the step when it gets prose. You
  approve the exact JSON, and the whole object (count and titles) goes to your
  webhook as JSON.
owner: oleg
enabled: true

triggers:
  - kind: manual

settings:
  model: openai/gpt-4o-mini
  budgetUsd: 0.10

steps:
  - id: jd-fetch
    kind: fetch
    config:
      name: "Read feed"
      url: "{{env.QCORE_SOURCE_URL}}"
      format: rss
      limit: "5"
      timeoutSec: "20"

  - id: jd-shape
    kind: llm-call
    config:
      name: "Shape it"
      format: json
      maxTokens: "600"
      instructions: |
        Return STRICTLY this JSON and nothing else — no fences, no prose:
        { "count": <integer>, "titles": ["<title>", …] }
        `count` is the number of entries you were given.

  - id: jd-approve
    kind: approval-gate
    config:
      name: "Send this list?"
      reviewer: human
      bind: sha256
      anchor: "Approve the exact JSON object (count and titles) that goes to your webhook"


  - id: jd-send
    kind: api-request
    config:
      name: "Send the shape"
      method: POST
      url: "{{env.QCORE_WEBHOOK_URL}}"
      expect: "2xx"
      timeoutSec: "20"
