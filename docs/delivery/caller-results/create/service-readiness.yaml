manifest: qf.loop/v1
id: service-readiness
name: "Service readiness"
version: 1.0.0
description: >
  Fetch the local health and data JSON endpoints and retain their responses
  for an independent readiness check.
owner: synthetic-test-owner
enabled: true
triggers:
  - kind: manual
steps:
  - id: health
    kind: fetch
    config:
      url: "http://127.0.0.1:58415/health"
      format: json
  - id: data
    kind: fetch
    config:
      url: "http://127.0.0.1:58415/data"
      format: json
