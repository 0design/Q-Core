manifest: qf.loop/v1
id: service-readiness-negative
name: "Service readiness negative case"
version: 1.0.0
description: >
  Intentionally fetch the local failing endpoint; HTTP 422 must stop the run.
owner: synthetic-test-owner
enabled: true
triggers:
  - kind: manual
steps:
  - id: fail
    kind: fetch
    config:
      url: "http://127.0.0.1:58415/fail"
      format: json
