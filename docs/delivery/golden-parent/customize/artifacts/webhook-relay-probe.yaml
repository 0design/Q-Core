manifest: qf.loop/v1

# Adapted from catalog loop webhook-relay@1.0.0.
# Source identity: 0design/QFactory.io,
# content/registry/loops/webhook-relay.yaml, revision e453b57.
# Source manifest SHA-256: fcfef0dedca7d769ebb21124a3ec9658e4576758277235b7a5549a8c15aba4a6.
# Changes: renamed the loop, replaced QLOOP_SOURCE_URL with the requested local
# JSON endpoint, removed the outbound api-request step and its webhook settings.

id: webhook-relay-probe
name: "Webhook relay: read-only JSON probe"
version: 1.0.0-adapted
description: >
  Read the local synthetic JSON endpoint and retain its fetched result for
  inspection. Adapted from webhook-relay@1.0.0; sending is intentionally removed.
owner: synthetic-test-owner
enabled: true

triggers:
  - kind: manual

settings:
  budgetUsd: 0.05

steps:
  - id: wr-fetch
    kind: fetch
    config:
      name: "Read local JSON source"
      url: "http://127.0.0.1:54423/data"
      format: json
      timeoutSec: "20"
