name: Registry
on:
  pull_request:
    paths: ['registry/**', 'src/**', 'bin/**', 'contracts/**', 'package.json', 'scripts/*registry*', 'test/test_registry_publish.py', '.github/workflows/*registry*']
  push:
    branches: [main, codex/shared-registry]
    paths: ['registry/**', 'src/**', 'bin/**', 'contracts/**', 'package.json', 'scripts/*registry*', 'test/test_registry_publish.py', '.github/workflows/*registry*']
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 -m unittest discover -s test -p test_registry_publish.py
      - name: Build and exercise exact downloadable candidate
        run: |
          mkdir -p /tmp/core-package
          # prepack guards run explicitly; their stdout must not mix with the pack JSON.
          npm run check:public-surface && npm run check:product-names
          npm pack --ignore-scripts --pack-destination /tmp/core-package --json > /tmp/core-package/pack.json
          CORE_ARCHIVE=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/core-package/pack.json'))[0].filename")
          # Committed catalog and SHA256SUMS must equal a fresh build with the reproducible Core archive.
          node scripts/build-registry.mjs --check --core-artifact "/tmp/core-package/$CORE_ARCHIVE"
          node scripts/build-registry.mjs --export /tmp/registry --core-artifact "/tmp/core-package/$CORE_ARCHIVE"
          node scripts/test-registry-export.mjs /tmp/registry
      - uses: actions/upload-artifact@v4
        with:
          name: registry-candidate
          path: /tmp/registry
