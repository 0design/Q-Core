name: Registry
on:
  pull_request:
    paths: ['registry/**', 'scripts/*registry*', 'test/test_registry_publish.py', '.github/workflows/*registry*']
  push:
    branches: [main, codex/shared-registry]
    paths: ['registry/**', 'scripts/*registry*', 'test/test_registry_publish.py', '.github/workflows/*registry*']
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 -m unittest discover -s test -p test_registry_publish.py
      - run: node scripts/build-registry.mjs --check
      - run: node scripts/build-registry.mjs --export /tmp/registry
      - uses: actions/upload-artifact@v4
        with:
          name: registry-candidate
          path: /tmp/registry
