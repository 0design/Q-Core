# Gate for contributed workflows.
#
# ON ACTIONS MINUTES: this repository is PUBLIC, and public repositories get
# GitHub-hosted runners for free. The house rule about preferring ssh/local over
# Actions is about METERED private repos, where a busy week can burn a month's
# quota. It does not apply here, and a pull request from a stranger has no other
# place to be checked.
#
# WHAT THIS CANNOT DO: run a workflow. That needs a model key, and a key does not go
# into a workflow triggered by a fork. Running it is the maintainer's step before
# merge — which is why the catalogue distinguishes "measured" from "not run yet".

name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No `npm ci`: the package has no dependencies, and that is a property
      # worth protecting. If a lockfile ever appears here, something was added
      # that the README says is not there.
      - name: no dependencies
        run: |
          deps=$(node -p "Object.keys(require('./package.json').dependencies||{}).length")
          if [ "$deps" != "0" ]; then
            echo "::error::package.json declares $deps dependency/ies. q-core ships with none — that is why it runs on a clean machine."
            exit 1
          fi

      - name: tests
        run: node --test test/*.test.mjs

      - name: public surface allowlist and private markers
        run: node scripts/check-public-surface.mjs

      # The standalone Registry builder validates every manifest, metadata and
      # generated catalog without executing contributed workflows or using secrets.
      - name: Registry manifests and generated catalog
        run: |
          mkdir -p /tmp/core-package
          npm pack --ignore-scripts --pack-destination /tmp/core-package >/dev/null
          node scripts/build-registry.mjs --check --core-artifact /tmp/core-package/q-core-$(node -p "require('./package.json').version").tgz

      # A manifest is meant to reference secrets, never to contain them.
      - name: no secrets committed
        run: |
          if grep -rInE '(sk-or-[A-Za-z0-9]{16,}|[0-9]{8,10}:[A-Za-z0-9_-]{30,})' \
               --exclude-dir=.git . ; then
            echo "::error::something shaped like an API key or a bot token is committed. Use {{env.NAME}}."
            exit 1
          fi
          echo "  clean"
