name: Contribution funnel

on:
  # The workflow definition and classifier below are taken from the trusted
  # base branch. PR content is fetched only as Git data for classification, or
  # later checked out in a read-only job that validates it.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  classify:
    name: classify contribution
    runs-on: ubuntu-latest
    outputs:
      funnel: ${{ steps.classify.outputs.funnel }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REF: refs/qf/contribution-pr-head
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request_target resolves this workflow from the base branch;
          # retain that boundary for the policy implementation too.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: classify
        name: select funnel from the complete diff
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          funnel=core
          # A malformed or unavailable PR head fails closed into Core. The
          # head is never checked out or executed in this policy step.
          if [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] && \
             git fetch --no-tags --depth=1 origin "$PR_HEAD_SHA:$PR_HEAD_REF"; then
            candidate="$(node scripts/classify-contribution.mjs --base "$BASE_SHA" --head "$PR_HEAD_REF" --funnel-only)" || candidate=""
            if [ "$candidate" = registry ]; then
              funnel=registry
            fi
          fi
          echo "funnel=$funnel" >> "$GITHUB_OUTPUT"

  registry:
    name: registry validation and candidate
    needs: classify
    if: needs.classify.outputs.funnel == 'registry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: syntax lint
        run: node --check scripts/build-registry.mjs
      - name: Registry catalog completeness
        run: node scripts/build-registry.mjs --check
      - name: exact downloadable candidate
        run: |
          mkdir -p /tmp/core-package
          npm pack --pack-destination /tmp/core-package --json > /tmp/core-package/pack.json
          core_archive="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/core-package/pack.json'))[0].filename")"
          node scripts/build-registry.mjs --export /tmp/registry --core-artifact "/tmp/core-package/$core_archive"
          node scripts/test-registry-export.mjs /tmp/registry
      - uses: actions/upload-artifact@v4
        with:
          name: registry-candidate-${{ github.event.pull_request.head.sha }}
          path: /tmp/registry

  core:
    name: core strict validation
    needs: classify
    if: needs.classify.outputs.funnel == 'core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: dependency boundary
        run: |
          test "$(node -p "Object.keys(require('./package.json').dependencies || {}).length")" = 0
      - name: full tests and installed-package checks
        run: |
          npm test
          npm run test:package
      - name: committed-secret scan
        run: |
          ! grep -rInE '(sk-or-[A-Za-z0-9]{16,}|[0-9]{8,10}:[A-Za-z0-9_-]{30,})' --exclude-dir=.git .
